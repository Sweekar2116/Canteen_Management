apiVersion: apps/v1
kind: Deployment
metadata:
  name: canteen-frontend
  namespace: canteen-hub
  labels:
    app: canteen-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: canteen-frontend
  template:
    metadata:
      labels:
        app: canteen-frontend
    spec:
      containers:
        - name: frontend
          image: canteen-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: canteen-frontend
  namespace: canteen-hub
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: canteen-frontend
