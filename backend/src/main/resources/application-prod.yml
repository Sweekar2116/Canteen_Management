# Production Profile Configuration
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

springdoc:
  swagger-ui:
    enabled: ${PROD_SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${PROD_SWAGGER_ENABLED:false}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.canteen: INFO
    org.springframework.web: WARN
    org.hibernate: ERROR
